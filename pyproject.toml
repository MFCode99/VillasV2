[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "villas-v2"
version = "0.1.0"
description = "Villas V2 foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.1.8",
  "alembic>=1.20.1",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.33",
  "argon2-cffi>=25.1.0",
  "pymysql>=1.2.3",
  "email-validator>=2.3.0",
  "Pillow>=13.0.0",
  "pillow-heif>=1.8.1",
  "openpyxl>=3.1.5",
  "reportlab>=5.1.0",
  "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.4.1.post1",
  "pypdf>=6.21.4"
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.routes"]
